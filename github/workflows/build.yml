              private void scheduleFollowUp(long delayMs) {
                  handler.removeCallbacks(followUpScanner);
                  handler.postDelayed(followUpScanner, delayMs);
              }

              private AccessibilityNodeInfo getItaxiRootNode() {
                  AccessibilityNodeInfo active = getRootInActiveWindow();
                  if (active != null) {
                      CharSequence pkg = active.getPackageName();
                      if (pkg != null && ITAXI_PACKAGE.equals(pkg.toString())) {
                          return active;
                      }
                      active.recycle();
                  }
                  try {
                      List<AccessibilityWindowInfo> windows = getWindows();
                      if (windows != null) {
                          for (AccessibilityWindowInfo win : windows) {
                              AccessibilityNodeInfo r = win.getRoot();
                              if (r != null) {
                                  CharSequence pkg = r.getPackageName();
                                  if (pkg != null && ITAXI_PACKAGE.equals(pkg.toString())) {
                                      return r;
                                  }
                                  r.recycle();
                              }
                          }
                      }
                  } catch (Exception ignored) {}
                  return null;
              }

              private boolean isCurrentTimeSlotAllowed() {
                  if (!prefs.getBoolean("time_filter_enabled", false)) {
                      return true;
                  }
                  Calendar cal = Calendar.getInstance();
                  int minOfDay = cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE);
                  int slotIndex = Math.max(0, Math.min(7, minOfDay / 180));
                  return prefs.getBoolean("slot_" + slotIndex, true);
              }

              private void scanActiveWindow() {
                  if (prefs == null) prefs = getSharedPreferences("bridge_logs", MODE_PRIVATE);
                  if (!prefs.getBoolean("auto_enabled", false)) return;
                  if (!isCurrentTimeSlotAllowed()) return;

                  AccessibilityNodeInfo root = getItaxiRootNode();
                  if (root == null) return;

                  List<AccessibilityNodeInfo> nodes = new ArrayList<>(120);
                  collectNodes(root, nodes, 0);

                  AccessibilityNodeInfo targetBtn = findSaveOrConfirmButton(nodes);

                  if (targetBtn != null) {
                      long now = System.currentTimeMillis();
                      if (now - lastClickTime >= 55) {
                          lastClickTime = now;
                          String actionLabel = getNormalizedText(targetBtn);
                          clickNodeFast(targetBtn);
                          scheduleFollowUp(25);
                          prefs.edit().putString("last_decision", "TURBO KLIK: " + actionLabel).apply();
                      } else {
                          scheduleFollowUp(25);
                      }
                  }

                  root.recycle();
              }

              private void collectNodes(AccessibilityNodeInfo node, List<AccessibilityNodeInfo> list, int depth) {
                  if (node == null || depth > 14 || list.size() > 200) return;
                  list.add(node);
                  int count = node.getChildCount();
                  for (int i = 0; i < count; i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child != null) {
                          collectNodes(child, list, depth + 1);
                      }
                  }
              }

              private AccessibilityNodeInfo findSaveOrConfirmButton(List<AccessibilityNodeInfo> nodes) {
                  AccessibilityNodeInfo saveCandidate = null;
                  for (AccessibilityNodeInfo n : nodes) {
                      if (!n.isVisibleToUser()) continue;
                      String t = getNormalizedText(n);
                      if (t.isEmpty() || t.length() > 30) continue;

                      if (t.contains("anuluj") || t.contains("rezygnuj") || t.contains("odrzuc")
                              || t.contains("cofnij") || t.equals("nie") || t.contains("rozpocznij kurs")) {
                          continue;
                      }

                      if (t.equals("potwierdz") || t.equals("potwierdzam") || t.equals("tak")
                              || t.equals("ok") || t.startsWith("potwierd")) {
                          return n;
                      }

                      if (saveCandidate == null && (t.contains("zapisz si") || t.equals("przyjmij") || t.equals("przyjmij zlecenie"))) {
                          saveCandidate = n;
                      }
                  }
                  return saveCandidate;
              }

              private void clickNodeFast(AccessibilityNodeInfo node) {
                  Rect rect = new Rect();
                  node.getBoundsInScreen(rect);
                  if (rect.width() > 0 && rect.height() > 0) {
                      int spreadX = Math.max(6, (int) (rect.width() * 0.30f));
                      int spreadY = Math.max(4, (int) (rect.height() * 0.25f));
                      int targetX = rect.centerX() + random.nextInt(spreadX * 2 + 1) - spreadX;
                      int targetY = rect.centerY() + random.nextInt(spreadY * 2 + 1) - spreadY;

                      if (Math.abs(targetX - lastTapX) < 14 && Math.abs(targetY - lastTapY) < 12) {
                          targetX = rect.centerX() + (targetX >= rect.centerX()
                                  ? -Math.max(14, spreadX / 2) : Math.max(14, spreadX / 2));
                          targetY = rect.centerY() + (targetY >= rect.centerY()
                                  ? -Math.max(9, spreadY / 2) : Math.max(9, spreadY / 2));
                      }

                      targetX = Math.max(5, targetX);
                      targetY = Math.max(5, targetY);
                      lastTapX = targetX;
                      lastTapY = targetY;

                      int durationMs = 14 + random.nextInt(8);
                      Path path = new Path();
                      path.moveTo(targetX, targetY);
                      GestureDescription.Builder builder = new GestureDescription.Builder();
                      builder.addStroke(new GestureDescription.StrokeDescription(path, 0, durationMs));
                      dispatchGesture(builder.build(), null, null);
                  } else {
                      AccessibilityNodeInfo current = node;
                      for (int i = 0; i < 4 && current != null; i++) {
                          if (current.isClickable() && current.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                              break;
                          }
                          current = current.getParent();
                      }
                  }
              }

              private String getNormalizedText(AccessibilityNodeInfo node) {
                  String raw = "";
                  if (node.getText() != null && node.getText().length() > 0) {
                      raw = node.getText().toString();
                  } else if (node.getContentDescription() != null && node.getContentDescription().length() > 0) {
                      raw = node.getContentDescription().toString();
                  }
                  if (raw.isEmpty()) return "";

                  String s = raw.toLowerCase();
                  StringBuilder sb = new StringBuilder(s.length());
                  boolean lastSpace = true;
                  for (int i = 0; i < s.length(); i++) {
                      char c = s.charAt(i);
                      if (c <= ' ') {
                          if (!lastSpace) {
                              sb.append(' ');
                              lastSpace = true;
                          }
                          continue;
                      }
                      lastSpace = false;
                      switch (c) {
                          case 'ą': sb.append('a'); break;
                          case 'ć': sb.append('c'); break;
                          case 'ę': sb.append('e'); break;
                          case 'ł': sb.append('l'); break;
                          case 'ń': sb.append('n'); break;
                          case 'ó': sb.append('o'); break;
                          case 'ś': sb.append('s'); break;
